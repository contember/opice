name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck harness
        run: bunx tsc --noEmit -p packages/harness/tsconfig.json

      - name: Typecheck worker
        run: bunx tsc --noEmit -p packages/worker/tsconfig.json

      - name: Typecheck CLI
        run: bunx tsc --noEmit -p packages/cli/tsconfig.json

      - name: Generate buzola routes + typecheck dashboard
        working-directory: packages/dashboard
        run: bun run gen && bunx tsc --noEmit

      - name: Build dashboard
        working-directory: packages/dashboard
        run: bun run build

      - name: Resolve Playwright version
        id: playwright
        working-directory: packages/harness
        run: echo "version=$(bun -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The harness launches headless chromium, which is the headless shell.
      - name: Install Playwright chromium
        working-directory: packages/harness
        run: bun x playwright install --with-deps --only-shell chromium

      # apps/self-test drives the deployed stage dashboard and needs OPICE_SELF_READ_TOKEN.
      - name: Test packages
        run: bun test ./packages
